# v1.12.1: Render Free web service + external Neon PostgreSQL.
# No Render disk or Render database is required.
# Existing services: add DATABASE_URL privately in Dashboard > Environment.
services:
  - type: web
    name: ultralink
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
