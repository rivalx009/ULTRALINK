<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ULTRALINK</title><link rel="stylesheet" href="ul.css"><link rel="icon" href="icon.svg"><link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05080a"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ULTRALINK"><link rel="apple-touch-icon" href="icon-180.png">
</head><body class="scan">
<div class="center">
  <div style="text-align:center">
    <div class="logo">ULTRALINK</div>
    <div class="sub" style="margin-top:10px">TACTICAL CYCLING TELEMETRY &amp; COMMS NETWORK</div>
  </div>
  <div class="panel corner" style="width:min(460px,92vw);padding:22px">
    <div class="sub" style="margin-bottom:14px">SELECT OPERATING MODE</div>
    <a href="rider.html" style="text-decoration:none"><button class="primary" style="width:100%;padding:18px;font-size:15px">◮ RIDER MODE</button></a>
    <div class="muted" style="font-size:10px;margin:8px 0 16px">Phone or laptop · Android, iPhone, Windows, Mac · GPS (+ BLE sensors on Chrome/Edge) · PTT radio</div>
    <a href="escort.html" style="text-decoration:none"><button style="width:100%;padding:18px;font-size:15px">▣ ESCORT MODE</button></a>
    <div class="muted" style="font-size:10px;margin-top:8px">Laptop, tablet or phone · Windows, Mac, Android, iPhone · mission control · map &amp; comms</div>
  </div>
  <div class="muted" id="inst" style="font-size:10px;max-width:460px;text-align:center;line-height:1.7"></div>
  <div class="sub" id="net">LINK: <span class="muted">checking…</span></div>
</div>
<script>
(function(){const ua=navigator.userAgent,ios=/iP(hone|ad|od)/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
 const t=standalone?'':ios?'Install: Safari → Share → <b>Add to Home Screen</b>':/Android/.test(ua)?'Install: Chrome menu ⋮ → <b>Add to Home screen</b>':'Install: Chrome / Edge address bar → <b>Install app</b> icon';
 if(!window.isSecureContext&&location.hostname!=='localhost')document.getElementById('inst').innerHTML='<span style="color:var(--warn)">Open this page over HTTPS — GPS and the microphone are blocked on plain http.</span>';else document.getElementById('inst').innerHTML=t;})();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
fetch('health').then(r=>r.text()).then(()=>net.innerHTML='LINK: <span style="color:var(--good)">RELAY ONLINE</span> · '+location.host)
 .catch(()=>net.innerHTML='LINK: <span style="color:var(--bad)">RELAY OFFLINE</span>');
</script></body></html>
